<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Roguelike RPG</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html, body {
        width: 100%;
        height: 100%;
        background: #1a1a2e;
        overflow: hidden;
      }
      #root {
        width: 100%;
        height: 100%;
      }
      #game-container {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
      }
      #ui-layer {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
      }
      #ui-layer > * {
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="game-container"></div>
      <div id="ui-layer"></div>
    </div>
    <script type="module" src="/src/ui/main.tsx"></script>
  </body>
</html>
